# CouchTomato API (replacement for the dead api.couchpota.to) + its Redis cache.
# Keys go in .env (copy .env.example). The port is bound to 127.0.0.1 by default;
# set API_BIND=0.0.0.0 in .env only on a box that should serve the LAN (e.g. the Pi5).
name: couchtomato-api
services:
  api:
    build: .
    container_name: couchtomato-api
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      # development keeps logs on stdout (docker logs) and logs every outgoing URL
      - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3110}:3000"
    depends_on:
      - redis
    # unless-stopped, never always: always would undo a deliberate/idle stop.
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: couchtomato-api-redis
    command: ["redis-server", "--save", "300", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
volumes:
  redis-data:
